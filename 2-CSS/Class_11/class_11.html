<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shadow</title>
    <style>
      .box {
        width: 300px;
        height: 200px;
        background-color: lightblue;
        box-shadow: 15px 5px 1px rgba(0, 0, 0, 0.5);
        padding: 20px;
        margin: 20px;
      }

      .text-shadow {
        text-shadow: 1px 2px 15px rgba(213, 140, 140, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Shadow</h1>

      <p class="text-shadow">This is a box with a shadow effect.</p>

      <h1>Text Shadow</h1>
    </div>
  </body>
</html>
