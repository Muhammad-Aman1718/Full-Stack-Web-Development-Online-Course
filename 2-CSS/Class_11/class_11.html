<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shadow</title>
    <style>
      .box {
        width: 300px;
        height: 200px;
        /* background-color: lightblue; */
        box-shadow: -150px -50px 10px 20px rgba(213, 140, 140, 0.8),
          10px -50px 10px 20px rgba(188, 164, 216, 0.8),
          150px -50px 10px 20px rgba(215, 31, 31, 0.8),
          150px 50px 10px 20px rgba(140, 213, 140, 0.8);
        padding: 20px;
        margin: 20px;
      }
      h1 {
        text-align: center;
      }
      .text-shadow {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Shadow</h1>

      <p class="text-shadow">This is a box with a shadow effect.</p>

      <h1>Text Shadow</h1>
    </div>
  </body>
</html>
