<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Animation</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        background-color: green;
        width: 100vw;
        height: 100vh;
      }

      .box {
        width: 100px;
        height: 100px;
        background-color: blueviolet;
        position: relative;
        animation: boxmove 5s ease-out 1s infinite forwards;
      }
      /* .title {
        color: white;
        text-align: center;
        margin-top: 20px;
        font-size: 30px;
        position: relative;
        animation-name: boxmove; 
        animation-duration: 1s;
        animation-iteration-count: infinite;
      } */
      @keyframes boxmove {
        /* from {
          background-color: blue;
          top: 10px;
          left: 10px;
        }
        to {
          background-color: yellow;
          top: 100px;
          left: 400px;
        } */

        0% {
          background-color: blueviolet;
          top: 10px;
          left: 10px;
        }
        50% {
          background-color: orange;
          top: 50px;
          left: 200px;
        }
        100% {
          background-color: red;
          top: 50px ;
          left: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
      <!-- <h1 class="title">CSS Animation</h1> -->
    </div>
  </body>
</html>
