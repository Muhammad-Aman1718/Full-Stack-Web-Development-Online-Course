<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Animation</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        background-color: green;
        width: 100vw;
        height: 100vh;
      }

      .box {
        width: 100px;
        height: 100px;
        background-color: red;
        position: relative;
        animation-name: boxmove;
        animation-duration: 3s;
        animation-delay: 2s;
        animation-iteration-count: infinite;
        animation-direction: reverse;
        animation-timing-function: ease-in-out;
      }
      .title {
        color: white;
        text-align: center;
        margin-top: 20px;
        font-size: 30px;
        position: relative;
        /* animation-name: boxmove; */
        animation-duration: 1s;
        animation-iteration-count: infinite;
      }
      @keyframes boxmove {
        from {
          /* top: 10px; */
          left: 10px;
        }
        to {
          background-color: yellow;
          /* top: 100px; */
          left: 400px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
      <!-- <h1 class="title">CSS Animation</h1> -->
    </div>
  </body>
</html>
